            - generic [ref=e67]:
                - paragraph [ref=e68]:
                    - text: AVM (
                    - code [ref=e69]: "`avm`"
                    - text: ) is a local config manager for AI coding agents. You build a reusable
                    - strong [ref=e70]: Agent
                    - text: — instructions, skills, MCP servers, and runtime preferences — and AVM renders it into runtime-specific managed config for whichever tool you launch, keeping your hand-edited files out of its way.
                - paragraph [ref=e71]:
                    - text: "It ships as two paired binaries:"
                    - code [ref=e72]: "`avm`"
                    - text: ", a non-interactive Go CLI built for scripts and CI (every command takes flags or stdin and can emit"
                    - code [ref=e73]: "`--json`"
                    - text: ), and
                    - code [ref=e74]: "`avm-ui`"
                    - text: ", a full-screen TypeScript TUI that shells out to"
                    - code [ref=e75]: "`avm`"
                    - text: over a documented JSON contract for interactive editing and browsing.
                - heading "Highlights" [level=2] [ref=e76]:
                    - link "Highlights" [ref=e77] [cursor=pointer]:
                        - /url: "#highlights"
                - list [ref=e78]:
                    - listitem [ref=e79]:
                        - text: Define an Agent once and apply it across runtimes; each driver reports every field as
                        - code [ref=e80]: "`native`"
                        - text: ","
                        - code [ref=e81]: "`rendered_as_instructions`"
                        - text: ","
                        - code [ref=e82]: "`ignored`"
                        - text: ", or"
                        - code [ref=e83]: "`unsupported`"
                        - text: .
                    - listitem [ref=e84]: Capabilities (skills and MCP servers) are auto-discovered from installed runtimes and content-addressed, so you can bootstrap and import what you already have.
                    - listitem [ref=e85]:
                        - text: Share or reinstall an Agent and its capabilities as a portable
                        - code [ref=e86]: "`.avm.zip`"
                        - text: Package, with conflict handling on install.
                    - listitem [ref=e87]:
                        - text: Per-(Agent, runtime) isolation boundaries keep managed config under
                        - code [ref=e88]: "`~/.avm`"
                        - text: — AVM never writes runtime-managed paths directly or copies secrets into portable profiles.
                    - listitem [ref=e89]:
                        - text: One-command install script sets up both binaries, initializes
                        - code [ref=e90]: "`~/.avm`"
                        - text: ", and adds shell integration for bash, zsh, or fish."
                - heading "Status" [level=2] [ref=e91]:
                    - link "Status" [ref=e92] [cursor=pointer]:
                        - /url: "#status"
                - paragraph [ref=e93]: Early preview. Codex, Claude Code, and OpenCode are supported runtimes; OpenClaw and Hermes Agent drivers are in progress. Built in Go (1.23) plus a TypeScript/Ink TUI requiring Node 22+, and released under the PolyForm Noncommercial License 1.0.0.
